enable
configure terminal
hostname Switch2
no ip domain-lookup
service password-encryption
enable secret class
!
vlan 50
 name BRANCH_STAFF
vlan 60
 name BRANCH_GUEST
vlan 97
 name BRANCH_MANAGEMENT
vlan 999
 name NATIVE_UNUSED
!
interface FastEthernet0/1
 description Trunk to Router3 Fa0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 50,60,97,999
 no shutdown
!
interface FastEthernet0/2
 description PC1 - branch staff VLAN 50
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/3
 description PC2 - branch guest VLAN 60
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 no shutdown
!
interface Vlan97
 description Switch management
 ip address 192.168.97.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.97.1
!
line console 0
 password cisco
 login
 logging synchronous
!
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
write memory
