enable
configure terminal
hostname Switch1
no ip domain-lookup
service password-encryption
enable secret class
!
vlan 30
 name HQ_FINANCE
vlan 40
 name HQ_IT
vlan 98
 name HQ_MANAGEMENT_2
vlan 999
 name NATIVE_UNUSED
!
interface FastEthernet0/1
 description PC4 - HQ finance VLAN 30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC5 - HQ IT VLAN 40
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/3
 description Trunk to MultilayerSwitch1 Fa0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,40,98,999
 no shutdown
!
interface Vlan98
 description Switch management
 ip address 192.168.98.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.98.1
!
line console 0
 password cisco
 login
 logging synchronous
!
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
write memory
