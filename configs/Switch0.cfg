enable
configure terminal
hostname Switch0
no ip domain-lookup
service password-encryption
enable secret class
!
vlan 10
 name HQ_ADMIN
vlan 20
 name HQ_USERS
vlan 99
 name HQ_MANAGEMENT
vlan 999
 name NATIVE_UNUSED
!
interface FastEthernet0/1
 description PC0 - HQ admin VLAN 10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description PC3 - HQ users VLAN 20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/3
 description Trunk to MultilayerSwitch0 Fa0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99,999
 no shutdown
!
interface Vlan99
 description Switch management
 ip address 192.168.99.11 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
line console 0
 password cisco
 login
 logging synchronous
!
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
write memory
